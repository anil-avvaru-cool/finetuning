[project]
name = "finetuning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anil Avvaru", email = "anil.avvaru.cool@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bitsandbytes>=0.50.2",
